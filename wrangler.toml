name = "zpan"
main = "./workers/bootstrap.ts"
compatibility_date = "2026-11-08"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/api",
  "/api/*",
  "/.well-known/oauth-authorization-server/*",
  "/.well-known/openid-configuration/*",
  "/.well-known/oauth-protected-resource/*",
  "/.well-known/zpan-domain-verification/*",
  "/dav",
  "/dav/*",
  "/r/*",
  "/s/*",
]

# Wrangler >= 4.45 auto-provisions bindings that omit resource IDs. `wrangler
# deploy` creates the D1 database and KV namespace on the target account and
# keeps them linked by name across deploys, so no account-specific IDs need to
# be committed here. Set the optional ZPAN_*_ID build variables to pin existing
# resources instead. See docs/deploy/workers-builds.md.
[[d1_databases]]
binding = "DB"
database_name = "zpan-dba"
migrations_dir = "./migrations"

[[kv_namespaces]]
binding = "CACHE_KV"

# Rate limiting namespaces are NOT auto-provisioned and do not need creating:
# namespace_id is an arbitrary account-local integer identifier.
[[ratelimits]]
name = "WEBDAV_RATE_LIMITER"
namespace_id = "2802"

[ratelimits.simple]
limit = 3600
period = 60

[vars]
ZPAN_CACHE_MODE = "distributed"
ZPAN_USERNAME = "admin"

[observability]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[triggers]
crons = ["*/10 * * * *", "10 * * * *", "0 */6 * * *", "0 */12 * * *", "0 0 1 * *", "0 4 * * *"]


