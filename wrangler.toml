name = "zpan"
main = "./workers/bootstrap.ts"
compatibility_date = "2026-11-08"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/api",
  "/api/*",
  "/.well-known/oauth-authorization-server/*",
  "/.well-known/openid-configuration/*",
  "/.well-known/oauth-protected-resource/*",
  "/.well-known/zpan-domain-verification/*",
  "/dav",
  "/dav/*",
  "/r/*",
  "/s/*",
]

# Wrangler >= 4.45 auto-provisions bindings that omit resource IDs. `wrangler
# deploy` creates the D1 database and KV namespace on the target account and
# keeps them linked by name across deploys, so no account-specific IDs need to
# be committed here. Set the optional ZPAN_*_ID build variables to pin existing
# resources instead. See docs/deploy/workers-builds.md.
[[d1_databases]]
binding = "DB"
database_name = "zpan-dba"
migrations_dir = "./migrations"

[[kv_namespaces]]
binding = "CACHE_KV"

# Rate limiting namespaces are NOT auto-provisioned and do not need creating:
# namespace_id is an arbitrary account-local integer identifier.
[[ratelimits]]
name = "WEBDAV_RATE_LIMITER"
namespace_id = "2802"

[ratelimits.simple]
limit = 3600
period = 60

# ZPAN_USERNAME / ZPAN_PASSWORD are runtime SECRETS set in the dashboard.
# Do not declare them as [vars]: a same-named plaintext var collides with the
# secret binding, and the committed value would be public in git.
[vars]
ZPAN_CACHE_MODE = "distributed"
ZPAN_USERNAME = "admin"

[observability]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1

# Workers Free allows 5 cron triggers per ACCOUNT (shared by every Worker on
# the account), Workers Paid allows 250. Keep this list minimal: each entry is
# matched by a branch in workers/scheduled.ts, and an unmatched cron only burns
# quota while waking the Worker for nothing.
#   10 * * * *   hourly stats rollup + WebDAV lock / resource-change cleanup
#   0 4 * * *    expired trash purge
[triggers]
crons = ["10 * * * *", "0 4 * * *"]


