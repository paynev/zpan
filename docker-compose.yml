# Build from source
# Usage: docker compose -f docker-compose.yml up -d --build

name: zpan

services:
  zpan:
    build: .
    ports:
      - "8222:8222"
    environment:
      - PORT=8222
      - ZPAN_USERNAME=${ZPAN_USERNAME:?ZPAN_USERNAME is required}
      - ZPAN_PASSWORD=${ZPAN_PASSWORD:?ZPAN_PASSWORD is required}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:8222}
      - DATABASE_URL=/data/zpan.db
    volumes:
      - zpan-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8222/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  zpan-data:
